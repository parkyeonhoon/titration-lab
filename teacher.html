<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사용 · 평가 정답 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  .wrap { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  .panel { margin-bottom: 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
  td, th { text-align: left; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h2>교사용 · 평가 모드 정답 확인</h2>
    <p class="muted">평가 모드에서는 <b>평가 코드 + 학번</b>으로 학생마다 미지 산이 정해져요. 같은 코드와 학번을 넣으면 학생에게 배정된 시료를 확인할 수 있어요. 이 페이지 주소는 학생에게 알려 주지 마세요.</p>
    <label>평가 코드<input id="code" autocomplete="off"></label>
    <label>학번 (한 줄에 한 명)<textarea id="ids" rows="6" placeholder="20301&#10;20302&#10;20303"></textarea></label>
    <button class="btn primary" id="go" type="button">배정 시료 보기</button>
  </div>
  <div class="panel">
    <table id="out"><thead><tr><th>학번</th><th>미지 산</th><th>세기</th><th>농도 (M)</th><th>중화점 부피 예시</th></tr></thead><tbody></tbody></table>
    <p class="note">중화점 부피 예시는 시료 10 mL를 0.1 M 표준 용액으로 적정할 때 값이에요. 학생이 고른 부피와 농도에 따라 달라져요 (nMV = n′M′V′).</p>
  </div>
</div>
<script type="module">
  import { SAMPLES, unknownFromSeed, equivalenceVolume } from './js/chem.js';
  const CFG = window.LAB_CONFIG || {};
  document.getElementById('go').addEventListener('click', () => {
    const code = document.getElementById('code').value.trim();
    const ids = document.getElementById('ids').value.split(/\s+/).map((s) => s.trim()).filter(Boolean);
    const tb = document.querySelector('#out tbody');
    tb.innerHTML = ids.map((id) => {
      const u = unknownFromSeed(`${code}|${id}`, CFG.unknownPool || ['HCl', 'HNO3', 'CH3COOH', 'HCOOH'], CFG.unknownRange || [0.05, 0.2]);
      const s = SAMPLES[u.key];
      return `<tr><td>${id}</td><td>${s.name} (${s.formula})</td><td>${s.strong ? '강산' : '약산'}</td><td>${u.conc.toFixed(3)}</td><td>${equivalenceVolume(u.key, u.conc, 10, 0.1).toFixed(2)} mL</td></tr>`;
    }).join('');
  });
</script>
</body>
</html>
